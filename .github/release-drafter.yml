name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Categories use the unified schema: label matching lives under `when`, and
# version resolution is expressed via `semver-increment` (the old top-level
# `version-resolver` block is deprecated). $RESOLVED_VERSION is derived from
# these increments and only suggests the next version for the draft's name/tag;
# the actual release tag (including rc/a/b prerelease suffixes) is still chosen
# by the maintainer when they push the tag. The resolver picks the highest
# increment across all matching categories.
categories:
  - title: "💥 Breaking Changes"
    semver-increment: "major"
    when:
      labels:
        - "breaking"
  - title: "🚀 Features"
    semver-increment: "minor"
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "🐛 Bug Fixes"
    # semver-increment defaults to "patch"
    when:
      labels:
        - "fix"
        - "bug"
  - title: "⬆️ Dependencies"
    when:
      labels:
        - "dependencies"
  - title: "📚 Documentation"
    when:
      labels:
        - "documentation"
  - title: "🔧 Maintenance"
    when:
      labels:
        - "chore"
        - "refactor"
  # Version-resolver-only entries: they affect $RESOLVED_VERSION but are not
  # rendered as changelog sections.
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "major"
  - type: "version-resolver"
    semver-increment: "patch" # fallback default when nothing else matches

# Labels are applied automatically from branch names and PR titles (see the
# branch-naming section in CONTRIBUTING.md). Missing labels are created on first
# use; maintainers may also apply/adjust labels by hand.
autolabeler:
  - label: "feature"
    branch:
      - '/^feat(ure)?\/.+/'
    title:
      - '/^feat(\(.+\))?!?:/i'
  - label: "fix"
    branch:
      - '/^(fix|bugfix|hotfix)\/.+/'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: "documentation"
    branch:
      - '/^docs?\/.+/'
    title:
      - '/^docs(\(.+\))?:/i'
  - label: "chore"
    branch:
      - '/^(chore|refactor|test|ci|build|style)\/.+/'
    title:
      - '/^(chore|refactor|test|ci|build|style)(\(.+\))?:/i'
  - label: "dependencies"
    branch:
      - '/^renovate\/.+/'
      - '/^dependabot\/.+/'
    title:
      - '/^\w+\(deps(-dev)?\):/i'
      - '/update .+ (dependency|to v?\d)/i'
      - '/bump .+ from .+ to .+/i'
  - label: "breaking"
    title:
      - '/^\w+(\(.+\))?!:/'
      - '/breaking change/i'

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
no-changes-template: "- No notable changes"

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/Draegerwerk/pysdccc/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
