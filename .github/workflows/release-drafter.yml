name: Release Drafter

on:
  push:
    # Update the draft release whenever commits land on main.
    branches:
      - main
  # pull_request_target (instead of pull_request) is required so the autolabeler
  # also works for pull requests opened from forks.
  pull_request_target:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create/update the draft release
      pull-requests: write   # apply labels via the autolabeler
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
